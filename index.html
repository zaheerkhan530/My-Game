<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AVIATOR</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0d14;color:#fff;font-family:Arial}
.top{padding:14px;background:#141a2a;display:flex;justify-content:space-between}
.top b{color:#ff3b6e}
.game{position:relative;height:480px;margin:10px;background:#101528;border-radius:20px;border:1px solid #222;overflow:hidden}
#cv{width:100%;height:100%}
.center{position:absolute;top:48%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}
#mul{font-size:68px;font-weight:900;text-shadow:0 2px 20px #000}
#msg{color:#8b93b0;margin-top:8px;font-size:14px;font-weight:700;letter-spacing:1px}
.panel{background:#141a2a;margin:10px;padding:16px;border-radius:18px}
.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.row button{background:#232b45;border:none;color:#fff;width:42px;height:42px;border-radius:10px;font-size:20px}
#mainBtn{width:100%;padding:18px;border:none;border-radius:14px;font-weight:900;font-size:19px;background:#00c950;color:#fff}
#mainBtn.cash{background:#ff3b6e;animation:pulse 0.8s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.02)}100%{transform:scale(1)}}
</style>
</head>
<body>
<div class="top"><div>✈ AVIATOR</div><div>BAL: <b id="bal">1000</b></div></div>
<div class="game"><canvas id="cv"></canvas><div class="center"><div id="mul">1.00x</div><div id="msg">BET LAGAO</div></div></div>
<div class="panel">
<div class="row"><div>BET: <b id="betTxt">10</b></div><div><button onclick="change(-10)">-</button> <button onclick="change(10)">+</button></div></div>
<button id="mainBtn" onclick="action()">BET 10</button>
</div>
<script>
let cv=document.getElementById('cv'),ctx=cv.getContext('2d'),W,H;
let bal=1000,bet=10,mult=1,playing=false,crash=2,t0,raf;
let trail=[];
function resize(){let r=cv.getBoundingClientRect();W=cv.width=r.width*2;H=cv.height=r.height*2}resize();onresize=resize;
function change(d){if(playing)return;bet=Math.max(5,Math.min(500,bet+d));document.getElementById('betTxt').innerText=bet;document.getElementById('mainBtn').innerText='BET '+bet}
function action(){if(!playing)start();else cashout()}
function start(){
 if(bal<bet){alert('Balance khatam!');bal=1000;document.getElementById('bal').innerText=bal;return}
 bal-=bet;document.getElementById('bal').innerText=bal;
 crash=Math.random()<0.25?1+Math.random()*0.8:1.8+Math.random()*8;
 playing=true;t0=Date.now();trail=[];
 document.getElementById('mainBtn').innerText='CASHOUT '+bet;document.getElementById('mainBtn').className='cash';
 document.getElementById('msg').innerText='UDD RAHA HAI...';
 loop();
}
function loop(){
 let e=(Date.now()-t0)/1000;
 mult=1+Math.pow(e,1.6)*0.35;
 if(mult>=crash){busted();return}
 document.getElementById('mul').innerText=mult.toFixed(2)+'x';
 draw(e);
 raf=requestAnimationFrame(loop);
}
function draw(e){
 ctx.clearRect(0,0,W,H);
 // grid
 ctx.strokeStyle='#1a2140';ctx.lineWidth=1;
 for(let i=0;i<6;i++){ctx.beginPath();ctx.moveTo(0,H-60-i*90);ctx.lineTo(W,H-60-i*90);ctx.stroke()}
 // trail in middle
 let px= W*0.15, py= H*0.75;
 trail.push({x:px+e*55, y:py - Math.pow(e,1.5)*55});
 if(trail.length>120)trail.shift();
 ctx.beginPath();ctx.strokeStyle='#ff3b6e';ctx.lineWidth=7;ctx.lineCap='round';ctx.lineJoin='round';
 if(trail.length>1){ctx.moveTo(trail[0].x,trail[0].y);for(let p of trail)ctx.lineTo(p.x,p.y)}ctx.stroke();
 // plane big in center area
 let lx=px+e*55, ly=py - Math.pow(e,1.5)*55;
 ctx.save();ctx.translate(lx,ly);ctx.rotate(-0.25);
 ctx.font='bold
