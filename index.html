<!doctype html><title>AVIATOR PRO</title><meta name=viewport content="width=device-width,initial-scale=1"><style>body{margin:0;background:#0b0e1a;color:#fff;font-family:Arial;text-align:center}#top{padding:10px;background:#151a2e;display:flex;justify-content:space-between;font-weight:900}#his{display:flex;gap:4px;padding:6px;background:#101528;overflow:auto;min-height:22px}#his span{padding:3px 8px;border-radius:10px;font-size:11px;font-weight:900}.r{background:#2a1a20;color:#ff6b8a}.g{background:#1a2a1e;color:#00ff88}.b{background:#1a203a;color:#6c8bff}#box{height:380px;background:#0f142b;margin:8px;border-radius:14px;border:1px solid #1e2747;position:relative}#mul{font-size:64px;font-weight:900;padding-top:40px}#plane{font-size:80px;margin:10px 0;display:block;transition:1s}#msg{color:#8aa0c0;letter-spacing:1px}#btn{width:94%;padding:16px;border:0;border-radius:12px;font-weight:900;font-size:18px;background:#00c853;color:#fff;margin-top:8px}#btn.c{background:#ff1744}</style><div id=top><span>✈ AVIATOR PRO</span><span id=bal>1000</span></div><div id=his></div><div id=box><div id=mul>1.00x</div><span id=plane>✈️</span><div id=msg>READY TO FLY</div></div><button id=btn onclick=play()>BET 10$</button><script>let B=1000,bet=10,M=1,P=0,C=2,H=[],A,t0,ctx=null;function AC(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state=='suspended')ctx.resume();return ctx}function beep(f,ty,d,v){try{let a=AC(),o=a.createOscillator(),g=a.createGain();o.type=ty;o.frequency.value=f;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(v,a.currentTime);g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+d);o.start();o.stop(a.currentTime+d)}catch{}}function addHis(x){H.unshift(x);if(H.length>10)H.pop();his.innerHTML=H.map(v=>`<span class=${v<2?'r':v<5?'b':'g'}>${v.toFixed(2)}x</span>`).join('')}function play(){AC();if(!P){if(B<bet)B=1000;B-=bet;bal.innerText=B;C=Math.random()<.2?1+Math.random():Math.random()<.7?1.5+Math.random()*3:5+Math.random()*10;P=1;t0=Date.now();btn.innerText='CASHOUT';btn.className='c';msg.innerText='FLYING...';mul.style.color='#fff';plane.style.transform='translate(60px,-40px) scale(1.4)';plane.style.filter='drop-shadow(0 0 20px #ff3b6e)';beep(100,'sawtooth',1,.6);loop()}else{cash()}}function loop(){let e=(Date.now()-t0)/1e3;M=1+Math.pow(e,1.5)*.4;if(M>=C){bust();return}mul.innerText=M.toFixed(2)+'x';requestAnimationFrame(loop)}function cash(){let w=Math.floor(bet*M);B+=w;bal.innerText=B;msg.innerText='WIN +'+w+'$ 💰';addHis(M);P=0;btn.innerText='BET '+bet+'$';btn.className='';plane.style.transform='translate(0,0) scale(1)';plane.style.filter='none';beep(600,'sine',.3,.9);setTimeout(()=>{mul.innerText='1.00x';msg.innerText='READY TO FLY'},900)}function bust(){P=0;mul.innerText=C.toFixed(2)+'x';mul.style.color='#ff3b6e';msg.innerText='FLEW AWAY 💥 '+C.toFixed(2)+'x';addHis(C);btn.innerText='BET '+bet+'$';btn.className='';plane.style.transform='translate(0,0) scale(1)';beep(120,'sawtooth',.8,.9);setTimeout(()=>{mul.innerText='1.00x';mul.style.color='#fff';msg.innerText='READY TO FLY'},1200)}addHis(2.34);addHis(1.12);addHis(8.91);</script>
