<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{margin:0;box-sizing:border-box;font-family:Arial}body{background:#0f0f12;color:#fff;height:100vh;display:flex;flex-direction:column}.top{height:44px;background:#1a1a1d;display:flex;justify-content:space-between;align-items:center;padding:0 14px}.top b{color:#ff0a3d;font-style:italic;font-size:22px}.hist{display:flex;gap:6px;padding:8px;overflow:auto;font-size:12px;background:#0f0f12}.hist span{background:#222;padding:2px 8px;border-radius:10px}#game{flex:1;position:relative;background:#000;margin:8px;border-radius:16px;border:1px solid #222;overflow:hidden}#rays{position:absolute;inset:0;background:repeating-conic-gradient(from 185deg at 10% 100%,#1a1a1a 0 12deg,#000 12deg 24deg)}#mul{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:70px;font-weight:900;z-index:5}#plane{position:absolute;left:20px;bottom:20px;font-size:28px;z-index:6}.ufc{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);text-align:center;z-index:4;width:100%}#panel{background:#1c1e26;border-radius:20px 20px 0 0;padding:12px}#btn{width:100%;background:#22c500;border:2px solid #7cff00;border-radius:14px;color:#fff;font-weight:900;font-size:24px;padding:16px;margin-top:10px}</style></head><body><div class="top"><b>Aviator</b><div style="color:#7cff00">1.00 PKR</div></div><div class="hist"><span>1.41x</span><span>1.76x</span><span style="color:#facc15">241.86x</span><span>2.36x</span></div><div id="game"><div id="rays"></div><div id="mul">1.00x</div><div id="plane">✈️</div><div class="ufc" id="ufc"><div style="color:#e11d48;font-size:38px;font-weight:900;font-style:italic">UFC</div><div style="font-size:12px">OFFICIAL PARTNERS</div><div style="margin-top:10px;color:#2cff00;border:1px solid #2cff00;border-radius:10px;padding:6px;width:150px;margin:auto">SPRIBE Official Game</div></div></div><div id="panel"><div style="display:flex;justify-content:space-between"><b id="bv">16.00</b><div><button onclick="bet-=5;up()" style="width:30px;height:30px;border-radius:50%">-</button><button onclick="bet+=5;up()" style="width:30px;height:30px;border-radius:50%">+</button></div></div><button id="btn" onclick="go()">BET 16.00 PKR</button></div><script>let bet=16,cur=1,on=0,st=0,lim=2,mul=document.getElementById('mul'),btn=document.getElementById('btn'),bv=document.getElementById('bv'),ufc=document.getElementById('ufc'),plane=document.getElementById('plane'),aCtx;function up(){bv.innerText=bet.toFixed(2);if(!on)btn.innerText='BET '+bet.toFixed(2)+' PKR'}function go(){if(!aCtx)aCtx=new(window.AudioContext||window.webkitAudioContext)();let o=aCtx.createOscillator(),g=aCtx.createGain();o.frequency.value=on?800:400;g.gain.value=0.2;o.connect(g);g.connect(aCtx.destination);o.start();o.stop(aCtx.currentTime+0.2);if(!on){lim=1+Math.random()*3;if(Math.random()>0.6)lim=3+Math.random()*5;on=1;st=Date.now();ufc.style.display='none';btn.style.background='#ff1744';loop();}else{on=0;btn.style.background='#22c500';btn.innerText='BET '+bet.toFixed(2)+' PKR';mul.innerText='1.00x';ufc.style.display='block';plane.style.left='20px';plane.style.bottom='20px';plane.style.top='auto';}}function loop(){if(!on)return;let e=(Date.now()-st)/1000;cur=1+e*0.75;mul.innerText=cur.toFixed(2)+'x';btn.innerText='CASHOUT '+(bet*cur).toFixed(2)+' PKR';let p=Math.min(e/4,1);let x=20+p*280;let y=250-Math.pow(p,1.5)*180;plane.style.left=x+'px';plane.style.top=y+'px';plane.style.bottom='auto';if(cur>=lim){mul.innerText='FLEW '+lim.toFixed(2)+'x';on=0;setTimeout(()=>{mul.innerText='1.00x';btn.style.background='#22c500';btn.innerText='BET '+bet.toFixed(2)+' PKR';ufc.style.display='block';plane.style.left='20px';plane.style.bottom='20px';plane.style.top='auto';},1200);return;}requestAnimationFrame(loop);}up();</script></body></html>
