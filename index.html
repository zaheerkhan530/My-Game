<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>AVIATOR SOUND</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0d14;color:#fff;font-family:Arial}.top{padding:14px;background:#141a2a;display:flex;justify-content:space-between}.top b{color:#ff3b6e}.game{position:relative;height:480px;margin:10px;background:#101528;border-radius:20px;overflow:hidden}.center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}#mul{font-size:64px;font-weight:900}#msg{color:#8b93b0;margin-top:8px}.panel{background:#141a2a;margin:10px;padding:16px;border-radius:18px}.row{display:flex;justify-content:space-between;margin-bottom:12px}.row button{width:40px;height:40px;border:none;border-radius:8px;background:#232b45;color:#fff;font-size:20px}#mainBtn{width:100%;padding:18px;border:none;border-radius:14px;font-weight:900;font-size:18px;background:#00c950;color:#fff}#mainBtn.cash{background:#ff3b6e;animation:pulse .8s infinite}@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.03)}100%{transform:scale(1)}}canvas{width:100%;height:100%}#soundBtn{background:#232b45;border:none;color:#fff;padding:6px 12px;border-radius:8px}</style></head><body><div class="top"><div>✈ AVIATOR</div><div><button id="soundBtn" onclick="toggleSound()">🔊 SOUND ON</button> BAL: <b id="bal">1000</b></div></div><div class="game"><canvas id="cv"></canvas><div class="center"><div id="mul">1.00x</div><div id="msg">BET LAGAO</div></div></div><div class="panel"><div class="row"><div>BET: <b id="betTxt">10</b></div><div><button onclick="change(-10)">-</button> <button onclick="change(10)">+</button></div></div><button id="mainBtn" onclick="action()">BET 10</button></div><script>let cv=document.getElementById('cv'),ctx=cv.getContext('2d'),W,H,bal=1000,bet=10,mult=1,playing=false,crash=2,t0,raf,trail=[],soundOn=true,audioCtx;function initAudio(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)()}function playTone(f,d,t,v){if(!soundOn)return;initAudio();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=t;o.frequency.value=f;o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(v||0.3, audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime+d);o.start();o.stop(audioCtx.currentTime+d)}function toggleSound(){soundOn=!soundOn;document.getElementById('soundBtn').innerText=soundOn?'🔊 SOUND ON':'🔇 SOUND OFF';if(soundOn){initAudio();playTone(600,0.2,'sine',0.4)}}function resize(){let r=cv.getBoundingClientRect();W=cv.width=r.width*2;H=cv.height=r.height*2}resize();onresize=resize;function change(d){if(playing)return;bet=Math.max(5,Math.min(500,bet+d));betTxt.innerText=bet;mainBtn.innerText='BET '+bet}function action(){if(!playing)start();else cashout()}function start(){initAudio();if(bal<bet)bal=1000;bal-=bet;document.getElementById('bal').innerText=bal;crash=Math.random()<0.25?1+Math.random()*0.8:1.8+Math.random()*8;playing=true;t0=Date.now();trail=[];mainBtn.innerText='CASHOUT';mainBtn.className='cash';msg.innerText='UDD RAHA HAI...';playTone(200,0.8,'sawtooth',0.4);setTimeout(()=>{if(playing)playTone(400,0.3,'sine',0.3)},200);loop()}function loop(){let e=(Date.now()-t0)/1000;mult=1+Math.pow(e,1.5)*0.3;if(mult>=crash){busted();return}mul.innerText=mult.toFixed(2)+'x';if(e%0.5<0.05)playTone(300+mult*20,0.08,'square',0.08);draw(e);raf=requestAnimationFrame(loop)}function draw(e){ctx.clearRect(0,0,W,H);let px=W*0.15,py=H*0.75;trail.push({x:px+e*50,y:py-Math.pow(e,1.4)*50});if(trail.length>100)trail.shift();ctx.beginPath();ctx.strokeStyle='#ff3b6e';ctx.lineWidth=7;ctx.lineCap='round';if(trail.length>1){ctx.moveTo(trail[0].x,trail[0].y);for(let p of trail)ctx.lineTo(p.x,p.y)}ctx.stroke();let lx=px+e*50,ly=py-Math.pow(e,1.4)*50;ctx.save();ctx.translate(lx,ly);ctx.font='bold 60px Arial';ctx.fillText('✈️',-10,-10);ctx.restore()}function cashout(){if(!playing)return;let win=Math.floor(bet*mult);bal+=win;document.getElementById('bal').innerText=bal;msg.innerText='JEET +'+win+' 💰';playing=false;mainBtn.innerText='BET '+bet;mainBtn.className='';cancelAnimationFrame(raf);playTone(523,0.15,'sine',0.5);setTimeout(()=>playTone(659,0.15,'sine',0.5),100);setTimeout(()=>playTone(784,0.4,'sine',0.5),200);setTimeout(reset,1800)}function busted(){playing=false;mul.innerText=crash.toFixed(2)+'x';mul.style.color='#ff3b6e';msg.innerText='FLEW AWAY! 💥';mainBtn.innerText='BET '+bet;mainBtn.className='';cancelAnimationFrame(raf);playTone(150,0.8,'sawtooth',0.6);setTimeout(()=>playTone(80,0.8,'sawtooth',0.6),150);setTimeout(reset,1800)}function reset(){mul.innerText='1.00x';mul.style.color='#fff';msg.innerText='BET LAGAO';trail=[];ctx.clearRect(0,0,W,H)}</script></body></html>
