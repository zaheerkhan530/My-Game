<!doctype html><html><head><meta name=viewport content="width=device-width,initial-scale=1"><style>body{margin:0;background:#0b0e1a;color:#fff;font-family:Arial;text-align:center}#t{padding:12px;background:#151a2e;display:flex;justify-content:space-between;font-weight:900}#b{height:420px;background:#0f142b;margin:8px;border-radius:14px;position:relative;overflow:hidden;border:1px solid #1e2747}#m{font-size:70px;font-weight:900;padding-top:35px}#p{font-size:70px;position:absolute;left:10%;top:62%;transition:1.3s}#bt{width:94%;padding:16px;border:0;border-radius:12px;font-weight:900;font-size:19px;background:#00c853;color:#fff;margin-top:8px}#bt.c{background:#ff1744}</style></head><body><div id=t><span>✈ AVIATOR PRO</span><span id=bal>1030</span></div><div id=b><div id=m>1.00x</div><div id=p>✈️</div><div id=msg>READY TO FLY</div></div><button id=bt onclick="fly()">BET 10$</button><script>let B=1030,bet=10,on=0,lim=2,st=0;function fly(){let mul=document.getElementById('m'),pl=document.getElementById('p'),msg=document.getElementById('msg'),bt=document.getElementById('bt'),bl=document.getElementById('bal');if(!on){if(B<bet)B=1000;B-=bet;bl.innerText=B;lim=Math.random()<.3?1+Math.random():Math.random()<.7?1.8+Math.random()*3:5+Math.random()*8;on=1;st=Date.now();bt.innerText='CASHOUT';bt.className='c';msg.innerText='FLYING...';pl.style.left='70%';pl.style.top='15%';pl.style.transform='rotate(-30deg) scale(1.5)';loop()}else{let e=(Date.now()-st)/1000;let cur=1+Math.pow(e,1.5)*.45;let win=Math.floor(bet*cur);B+=win;bl.innerText=B;msg.innerText='WIN '+win+'$';on=0;bt.innerText='BET '+bet+'$';bt.className='';pl.style.left='10%';pl.style.top='62%';pl.style.transform='rotate(0) scale(1)';mul.innerText='1.00x';msg.innerText='READY TO FLY'}}function loop(){if(!on)return;let mul=document.getElementById('m');let e=(Date.now()-st)/1000;let cur=1+Math.pow(e,1.5)*.45;if(cur>=lim){let pl=document.getElementById('p'),msg=document.getElementById('msg'),bt=document.getElementById('bt'),mul2=document.getElementById('m');on=0;mul2.innerText=lim.toFixed(2)+'x';mul2.style.color='#ff3b6e';msg.innerText='FLEW AWAY '+lim.toFixed(2)+'x';bt.innerText='BET '+bet+'$';bt.className='';pl.style.left='10%';pl.style.top='62%';pl.style.transform='rotate(0) scale(1)';setTimeout(()=>{mul2.innerText='1.00x';mul2.style.color='#fff';msg.innerText='READY TO FLY'},1200);return}mul.innerText=cur.toFixed(2)+'x';requestAnimationFrame(loop)}</script></body></html>
